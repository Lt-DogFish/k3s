apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esp32-devices
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Lt-DogFish/k3s.git
    targetRevision: HEAD
    path: apps/devices/base # Pointing to the new folder structure
  destination:
    server: "https://kubernetes.default.svc"
    namespace: esp32
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
