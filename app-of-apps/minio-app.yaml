apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:Lt-DogFish/k3s.git
    targetRevision: main
    path: apps/minio/base

    kustomize:
      buildOptions: "--enable-helm"

  destination:
    server: https://kubernetes.default.svc
    namespace: minio

  syncPolicy:
    automated:
      prune: true
      selfHeal: true