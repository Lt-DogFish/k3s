apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:Lt-DogFish/k3s.git
    targetRevision: main
    path: apps/n8n/base

    kustomize:
      buildOptions: "--enable-helm"

  destination:
    server: "https://kubernetes.default.svc"
    namespace: n8n

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
