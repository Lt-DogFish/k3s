apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
  namespaceProperty: esp32
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
      - image: ghcr.io/lt-dogfish/portfolio-site:latest
        imagePullPolicy: Always
        name: web
