name: Build and Push Operator to GHCR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          echo "version=v${{ github.run_number }}" >> $GITHUB_OUTPUT

      # 1. Set up QEMU for multi-architecture emulation support
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
    
      # 2. Set up Docker Buildx instance
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/devices/python-operator/
          file: ./apps/devices/python-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lt-dogfish/python-operator:latest
            ghcr.io/lt-dogfish/python-operator:${{ steps.version.outputs.version }}
