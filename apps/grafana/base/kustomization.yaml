apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ingress.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.x.x
    releaseName: kube-stack
    valuesFile: values.yaml
    #earlier kusomization namespacing did not work because kustomization forces  name space
    #and apparently prometheus doesnt like that due to the wak this helm chart works.
    namespace: monitoring
    includeCRDs: true
