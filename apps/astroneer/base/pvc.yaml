apiVersion: v1
kind: PersistentVolume
metadata:
  name: astroneer-local-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/data/astroneer # The folder must exist physically on node2-48ecc894
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node2-48ecc894
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: astroneer-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
