apiVersion: v1
kind: ServiceAccount
metadata:
  name: esp32-python-operator-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: esp32-operator-role
rules:
  - apiGroups: ["iot.homelab"]
    resources: ["esp32devices", "esp32devices/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: esp32-operator-binding
subjects:
  - kind: ServiceAccount
    name: esp32-python-operator-sa
    namespace: esp32
roleRef:
  kind: ClusterRole
  name: esp32-operator-role
  apiGroup: rbac.authorization.k8s.io