apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: esp32devices.iot.homelab
spec:
  group: iot.homelab
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                macAddress:
                  type: string
                targetFirmwareVersion:
                  type: string
            status:
              type: object
              properties:
                currentFirmwareVersion:
                  type: string
                connectionState:
                  type: string
                lastSeen:
                  type: string
      additionalPrinterColumns:
        - name: MAC
          type: string
          jsonPath: .spec.macAddress
        - name: Firmware
          type: string
          jsonPath: .status.currentFirmwareVersion
        - name: Status
          type: string
          jsonPath: .status.connectionState
  scope: Namespaced
  names:
    plural: esp32devices
    singular: esp32device
    kind: ESP32Device
    shortNames:
      - esp32