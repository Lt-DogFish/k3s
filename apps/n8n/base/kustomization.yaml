apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#name space precreated via Lens
namespace: n8n

resources: []

helmCharts:
  - name: n8n
    repo: oci://ghcr.io/n8n-io/n8n-helm-chart
    version: 1.4.3
    releaseName: n8n
    valuesInline:
      # Instruct n8n to pull the encryption key from the secret made in Lens
      secretRefs:
        existingSecret: "n8n-secrets"

      # Scaling configuration to 1
      replicaCount: 1

      # Persistent storage
      persistence:
        enabled: true
        size: 5Gi
        accessModes:
          - ReadWriteOnce

      # Traefik routing integration
      ingress:
        enabled: true
        className: "traefik"
        annotations:
          ingress.kubernetes.io/ssl-redirect: "true"
        hosts:
          - host: n8n.ravijey.com
            paths:
              - path: /
                pathType: Prefix
